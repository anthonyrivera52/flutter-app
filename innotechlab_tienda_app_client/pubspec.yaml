name: flutter_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.0
  
  intl: ^0.20.2 # For currency formatting
  # Supabase
  supabase_flutter: ^2.9.0

  # State Management
  flutter_riverpod: ^2.5.1

  go_router: ^10.0.0
  motion_tab_bar: ^2.0.4

  equatable: ^2.0.7 # For value equality
  shimmer: ^3.0.0 # Para efectos de skeleton loader
  
  # Image Picker for Profile
  image_picker: ^1.1.2 # ADD THIS LINE
  
  uuid: ^4.5.1
  badges: ^3.1.2
  info_toast: ^1.0.0
  dartz: ^0.10.1

  slide_action: ^0.0.2

  # HTTP Client for API calls
  http: ^1.2.0

  # Connectivity
  connectivity_plus: ^6.0.0 # Asegúrate de usar la última versión estable

  #Image Caching
  cached_network_image: ^3.3.1 # Añade esta línea

  # Geolocation and Maps
  geolocator: ^12.0.0 # For getting user location
  google_maps_flutter: ^2.6.1 # For displaying maps
  flutter_map: ^7.0.0 # OpenSource maps (no API key needed)
  latlong2: ^0.9.0 # Coordinates handling
  flutter_dotenv: ^6.0.0

  # Security
  flutter_secure_storage: ^9.2.2 # Secure storage for tokens
  crypto: ^3.0.3 # For hashing and encryption

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon-512x512.png"
  min_sdk_android: 21 # android min sdk min:16, default:21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - .env.development
    - .env.production
